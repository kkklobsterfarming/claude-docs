baseURL: "https://claude-docs.devbionics.com/"
title: "Agentic Coding in Terminal"

enableRobotsTXT: true
enableGitInfo: true
enableInlineShortcodes: true

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

# llms.txt convention (https://llmstxt.org) — curated index + full-content
# dump rendered from the home page so LLM consumers can ingest the docs
# without scraping HTML.
outputFormats:
  LlmsTxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  LlmsFullTxt:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

outputs:
  # Pre-workshop lockdown: LlmsTxt/LlmsFullTxt removed so the
  # generated /llms-full.txt does not expose the full docs corpus.
  # Restore by appending `, LlmsTxt, LlmsFullTxt` before the workshop.
  home: [HTML, RSS]

# Pre-workshop lockdown: navbar menu hidden so attendees only see the
# setup guide. Uncomment the block below to restore Documentation /
# Search / GitHub entries.
# menu:
#   main:
#     - identifier: documentation
#       name: Documentation
#       pageRef: /docs
#       weight: 1
#     - name: Search
#       weight: 2
#       params:
#         type: search
#     - name: GitHub
#       weight: 3
#       url: "https://github.com/stcomiin/claude-docs"
#       params:
#         icon: github

params:
  # Site description. Read by Hextra's opengraph and page-description
  # partials via .Site.Params.description (top-level `description` is not
  # mirrored into Site.Params, so it must live here to be picked up).
  description: "Workshop materials — Apex Builders Collective × Info PC"

  # Used by Hextra's opengraph partial and Hugo's internal twitter_cards
  # partial to populate og:image / twitter:image for link previews
  # (Telegram, WhatsApp, Slack, X, Facebook, etc.).
  images:
    - images/og-cover.png

  # Pre-workshop lockdown: banner disabled — it advertised /llms-full.txt
  # which would have leaked the full docs corpus. Restore by uncommenting.
  # banner:
  #   key: llms-banner-v1

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  theme:
    default: dark
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    # Pre-workshop lockdown: "Powered by Hextra" link removed because it
    # points to a GitHub repo. Flip back to true to restore.
    displayPoweredBy: false

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    # Pre-workshop lockdown: "Edit this page" link disabled to hide the
    # GitHub repo. Flip back to true to restore.
    enable: false
    base: "https://github.com/stcomiin/claude-docs/edit/main/content"

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: wide
